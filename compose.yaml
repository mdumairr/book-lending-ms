services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booklending
      POSTGRES_USER: booklending
      POSTGRES_PASSWORD: booklending
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booklending -d booklending"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: book-lending-ms:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booklending
      SPRING_DATASOURCE_USERNAME: booklending
      SPRING_DATASOURCE_PASSWORD: booklending
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
